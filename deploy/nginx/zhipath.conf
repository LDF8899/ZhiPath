# ZhiPath production frontends for the host's LAN/Tailscale IP.
# Production frontend ports use high, currently unused values 49173/49180;
# API traffic is proxied to the private backend listener.

# Optional no-port LAN aliases. Add the same names to each client device's
# hosts file (or local DNS) to resolve them to the server IP.
server {
    listen 80;
    listen [::]:80;
    server_name zhipath.lan;
    root /var/www/zhipath/frontend;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-App $http_x_client_app;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}


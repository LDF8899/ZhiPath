# ZhiPath production frontends for the host's LAN/Tailscale IP.
# The frontend ports are intentionally kept at 5173/5180 to preserve the
# existing URLs; API traffic is proxied to the private backend listener.

server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /var/www/zhipath/frontend;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-App $http_x_client_app;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

